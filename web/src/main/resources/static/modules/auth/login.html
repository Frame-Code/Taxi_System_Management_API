<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Stin City Taxi — Iniciar sesión</title>
    <link rel="icon" type="image/x-icon" href="/public/assets/img/taxi-front-fill.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #2937f0 0%, #9f1ae2 100%);
            font-family: 'Mulish', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 420px;
        }

        /* Marca arriba del card */
        .auth-brand {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .auth-brand img {
            height: 2.8rem;
            filter: brightness(0) invert(1);
        }

        .auth-brand span {
            display: block;
            color: rgba(255,255,255,0.85);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-top: 0.4rem;
        }

        /* Card blanca */
        .auth-card {
            background: #ffffff !important;
            border: none !important;
            border-radius: 1.5rem !important;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.22) !important;
            padding: 2.5rem 2.25rem !important;
        }

        .auth-card-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #111827;
            margin-bottom: 0.25rem;
        }

        .auth-card-subtitle {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 2rem;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 700;
            color: #374151;
            margin-bottom: 0.4rem;
            display: block;
        }

        .form-control {
            background: #f9fafb !important;
            border: 1.5px solid #e5e7eb !important;
            border-radius: 0.75rem !important;
            padding: 0.7rem 1rem !important;
            font-size: 0.95rem !important;
            font-family: 'Mulish', sans-serif !important;
            color: #111827 !important;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            background: #fff !important;
            border-color: #2937f0 !important;
            box-shadow: 0 0 0 3px rgba(41, 55, 240, 0.12) !important;
            outline: none;
        }

        .form-control::placeholder {
            color: #9ca3af;
        }

        .btn-auth {
            display: block;
            width: 100%;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, #2937f0 0%, #9f1ae2 100%);
            border: none;
            border-radius: 50rem;
            font-family: 'Mulish', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            margin-top: 0.5rem;
        }

        .btn-auth:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-auth:active {
            transform: translateY(0);
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #d1d5db;
            font-size: 0.8rem;
            margin: 1.5rem 0;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .auth-footer-text {
            text-align: center;
            font-size: 0.88rem;
            color: #6b7280;
            margin: 0;
        }

        .auth-footer-text a {
            color: #2937f0;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer-text a:hover {
            color: #9f1ae2;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

    <div class="auth-wrapper">

        <div class="auth-brand">
            <img src="/public/assets/img/sct-logo.png" alt="Stin City Taxi" />
        </div>

        <div class="auth-card">
            <h1 class="auth-card-title">Bienvenido de vuelta</h1>
            <p class="auth-card-subtitle">Ingresa tus datos para continuar</p>

            <div style="margin-bottom: 1.1rem;">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email"
                       placeholder="tu@correo.com" autocomplete="email" />
            </div>

            <div style="margin-bottom: 1.75rem;">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password"
                       placeholder="••••••••" autocomplete="current-password" />
            </div>

            <button id="btnLogin" class="btn-auth">
                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
            </button>

            <div class="auth-divider">o</div>

            <p class="auth-footer-text">
                ¿Eres nuevo? <a href="register.html">Crea una cuenta</a>
            </p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/login.js"></script>
</body>
</html>
