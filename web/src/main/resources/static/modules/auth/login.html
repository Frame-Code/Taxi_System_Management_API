<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>Stin city taxi - Login</title>

    <link rel="icon" type="image/x-icon" href="/public/assets/img/taxi-front-fill.svg" />
    <!-- Custom fonts for this template-->
    <link href="/shared/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="/shared/css/sb-admin-2.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">
</head>

<body class="bg-gradient-primary">

    <div class="container">

        <!-- Outer Row -->
        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-">

                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <!-- Nested Row within Card Body -->
                                <div class="p-5">
                                    <div class="text-center">
                                        <h1 class="h4 text-gray-900 mb-4">Bienvenido de vuelta</h1>
                                    </div>
                                    <form class="user">
                                        <div class="form-group">
                                            <label for="email" class="text-gray-900">
                                                Escribe aquí tu correo:
                                            </label><input type="email" class="form-control form-control-user"
                                                      id="email" aria-describedby="emailHelp"
                                                      placeholder="Escribe tu correo">
                                        </div>
                                        <div class="form-group">
                                            <label for="password" class="text-gray-900">
                                                Escribe aquí tu contraseña:
                                            </label><input type="password" class="form-control form-control-user"
                                                                 id="password" placeholder="Escribe tu contraseña">
                                        </div>
                                        <div class="form-group">
                                            <div class="custom-control custom-checkbox small">
                                                <input type="checkbox" class="custom-control-input" id="customCheck">
                                                <label class="custom-control-label" for="customCheck">Recuérdame</label>
                                            </div>
                                        </div>
                                        <a id="btnLogin" class="btn btn-primary btn-user btn-block" style="font-size: 18px;">
                                            Iniciar sesión
                                        </a>
                                        <hr>
                                    </form>
                                    <div class="text-center">
                                        Eres nuevo&#63;
                                        <a class="small" href="register.html">Crea una cuenta ahora!</a>
                                    </div>
                            </div>
                        </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="/shared/vendor/jquery/jquery.min.js"></script>
    <script src="/shared/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Core plugin JavaScript-->
    <script src="/shared/vendor/jquery-easing/jquery.easing.min.js"></script>

    <!-- Custom scripts for all pages-->
    <script src="/shared/js/sb-admin-2.min.js"></script>

    <script src="./js/login.js"></script>
</body>

</html>
