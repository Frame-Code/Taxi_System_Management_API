<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Stin City Taxi — Crear cuenta</title>
    <link rel="icon" type="image/x-icon" href="/public/assets/img/taxi-front-fill.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #2937f0 0%, #9f1ae2 100%);
            font-family: 'Mulish', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 520px;
        }

        /* Marca arriba del card */
        .auth-brand {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .auth-brand img {
            height: 2.8rem;
            filter: brightness(0) invert(1);
        }

        .auth-brand span {
            display: block;
            color: rgba(255,255,255,0.85);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-top: 0.4rem;
        }

        /* Card blanca */
        .auth-card {
            background: #ffffff !important;
            border: none !important;
            border-radius: 1.5rem !important;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.22) !important;
            padding: 2.5rem 2.25rem !important;
        }

        .auth-card-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #111827;
            margin-bottom: 0.25rem;
        }

        .auth-card-subtitle {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 1.75rem;
        }

        /* Separador de sección */
        .section-label {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #9f1ae2;
            margin: 1.5rem 0 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1.5px solid #f3e8ff;
        }

        .section-label:first-of-type {
            margin-top: 0;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 700;
            color: #374151;
            margin-bottom: 0.4rem;
            display: block;
        }

        .form-control {
            background: #f9fafb !important;
            border: 1.5px solid #e5e7eb !important;
            border-radius: 0.75rem !important;
            padding: 0.7rem 1rem !important;
            font-size: 0.92rem !important;
            font-family: 'Mulish', sans-serif !important;
            color: #111827 !important;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            background: #fff !important;
            border-color: #2937f0 !important;
            box-shadow: 0 0 0 3px rgba(41, 55, 240, 0.12) !important;
            outline: none;
        }

        .form-control::placeholder {
            color: #9ca3af;
            font-size: 0.88rem;
        }

        .field-group {
            margin-bottom: 1rem;
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.875rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 480px) {
            .field-row {
                grid-template-columns: 1fr;
            }
        }

        .btn-auth {
            display: block;
            width: 100%;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, #2937f0 0%, #9f1ae2 100%);
            border: none;
            border-radius: 50rem;
            font-family: 'Mulish', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            margin-top: 0.75rem;
        }

        .btn-auth:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-auth:active {
            transform: translateY(0);
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #d1d5db;
            font-size: 0.8rem;
            margin: 1.5rem 0;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .auth-footer-text {
            text-align: center;
            font-size: 0.88rem;
            color: #6b7280;
            margin: 0;
        }

        .auth-footer-text a {
            color: #2937f0;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer-text a:hover {
            color: #9f1ae2;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

    <div class="auth-wrapper">

        <div class="auth-brand">
            <img src="/public/assets/img/sct-logo.png" alt="Stin City Taxi" />
        </div>

        <div class="auth-card">
            <h1 class="auth-card-title">Crea tu cuenta</h1>
            <p class="auth-card-subtitle">Únete y pide tu taxi en segundos</p>

            <!-- Sección: datos personales -->
            <p class="section-label">Datos personales</p>

            <div class="field-row">
                <div>
                    <label for="names" class="form-label">Nombres</label>
                    <input type="text" class="form-control" id="names"
                           placeholder="Ej. Juan Carlos" autocomplete="given-name" />
                </div>
                <div>
                    <label for="lastnames" class="form-label">Apellidos</label>
                    <input type="text" class="form-control" id="lastnames"
                           placeholder="Ej. Pérez López" autocomplete="family-name" />
                </div>
            </div>

            <div class="field-row">
                <div>
                    <label for="phone" class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" id="phone"
                           placeholder="Ej. 0991234567" autocomplete="tel" />
                </div>
                <div>
                    <label for="borndate" class="form-label">Fecha de nacimiento</label>
                    <input type="date" class="form-control" id="borndate" />
                </div>
            </div>

            <!-- Sección: cuenta -->
            <p class="section-label">Cuenta</p>

            <div class="field-group">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email"
                       placeholder="tu@correo.com" autocomplete="email" />
            </div>

            <div class="field-row" style="margin-bottom: 0;">
                <div>
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password"
                           placeholder="••••••••" autocomplete="new-password" />
                </div>
                <div>
                    <label for="repeatPassword" class="form-label">Confirmar contraseña</label>
                    <input type="password" class="form-control" id="repeatPassword"
                           placeholder="••••••••" autocomplete="new-password" />
                </div>
            </div>

            <button id="btnRegister" class="btn-auth">
                <i class="bi bi-person-plus-fill me-2"></i>Crear cuenta
            </button>

            <div class="auth-divider">o</div>

            <p class="auth-footer-text">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/register.js"></script>
</body>
</html>
