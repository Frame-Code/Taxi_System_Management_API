<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="description" content="">
        <meta name="author" content="">
        <title>Stin city taxi - Login</title>

        <link rel="icon" type="image/x-icon" href="/static/public/assets/img/taxi-front-fill.svg" />
        <!-- Custom fonts for this template-->
        <link href="/static/shared/css/sb-admin-2.min.css" rel="stylesheet">
        <link href="/static/shared/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
        <link
            href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
            rel="stylesheet">
    </head>

    <body class="bg-gradient-primary">

        <div class="container">

            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-0">
                    <!-- Nested Row within Card Body -->
                    <div class="row">
                        <div class="col">
                            <div class="p-5">
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-4">¡Crea tu cuenta ahora mismo!</h1>
                                </div>
                                <form class="user">
                                    <div class="form-group row">
                                        <div class="col-sm-6 mb-3 mb-sm-0">
                                            <input type="text" class="form-control form-control-user" id="inpFirstName"
                                                   placeholder="Escribe tus nombres...">
                                        </div>
                                        <div class="col-sm-6">
                                            <input type="text" class="form-control form-control-user" id="impLastName"
                                                   placeholder="Escribe tus apellidos...">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <input type="email" class="form-control form-control-user" id="impEmail"
                                               placeholder="Escribe tu correo...">
                                    </div>
                                    <div class="form-group">
                                        <input type="text" class="form-control form-control-user" id="impPhone"
                                               placeholder="Escribe tu numero de teléfono...">
                                    </div>
                                    <div class="form-group">
                                        <label for="impDate">Escribe tu fecha de nacimiento: </label>
                                        <input type="date" class="form-control" id="impDate"
                                                                            placeholder="Escribe tu numero de teléfono...">
                                    </div>
                                    <div class="form-group row">
                                        <div class="col-sm-6 mb-3 mb-sm-0">
                                            <input type="password" class="form-control form-control-user"
                                                   id="inputPassword" placeholder="Escribe tu contraseña...">
                                        </div>
                                        <div class="col-sm-6">
                                            <input type="password" class="form-control form-control-user"
                                                   id="repeatPassword" placeholder="Repite tu contraseña...">
                                        </div>
                                    </div>
                                    <a id="btnRegister" class="btn btn-primary btn-user btn-block"> Registrarse </a>
                                    <hr>
                                </form>
                                <hr>
                                <div class="text-center">
                                    <a class="small" href="login.html">Ya tienes cuenta? ¡Inicia sessión!</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bootstrap core JavaScript-->
        <script src="/static/shared/vendor/jquery/jquery.min.js"></script>
        <script src="/static/shared/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

        <!-- Core plugin JavaScript-->
        <script src="/static/shared/vendor/jquery-easing/jquery.easing.min.js"></script>

        <!-- Custom scripts for all pages-->
        <script src="/static/shared/js/sb-admin-2.min.js"></script>

        <script src="js/register.js"></script>

    </body>

</html>
