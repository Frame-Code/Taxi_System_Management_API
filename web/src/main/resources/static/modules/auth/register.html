<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="description" content="">
        <meta name="author" content="">
        <title>Stin city taxi - Login</title>

        <link rel="icon" type="image/x-icon" href="/public/assets/img/taxi-front-fill.svg" />
        <!-- Custom fonts for this template-->
        <link href="/shared/css/sb-admin-2.min.css" rel="stylesheet">
        <link href="/shared/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
        <link
            href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
            rel="stylesheet">
    </head>

    <body class="bg-gradient-primary">

        <div class="container">

            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-0">
                    <!-- Nested Row within Card Body -->
                    <div class="row">
                        <div class="col">
                            <div class="p-5">
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-4">¡Crea tu cuenta ahora mismo!</h1>
                                </div>
                                <form class="user">
                                    <div class="form-group row">
                                        <div class="col-sm-6 mb-3 mb-sm-0">
                                            <label for="names" class="text-gray-900">
                                                Escribe tus nombres:
                                            </label><input type="text" class="form-control form-control-user" id="names"
                                                                                     placeholder="Escribe tus nombres...">
                                        </div>
                                        <div class="col-sm-6">
                                            <label class="text-gray-900" for="lastnames">Escribe tus apellidos:</label>
                                            <input type="text" class="form-control form-control-user" id="lastnames"
                                                                                    placeholder="Escribe tus apellidos...">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="text-gray-900" for="email">Escribe tu correo:</label><input type="email" class="form-control form-control-user" id="email"
                                                                             placeholder="Escribe tu correo...">
                                    </div>
                                    <div class="form-group">
                                        <label class="text-gray-900" for="phone">Escribe tu numero de teléfono:</label><input type="text" class="form-control form-control-user" id="phone"
                                                                             placeholder="Escribe tu numero de teléfono...">
                                    </div>
                                    <div class="form-group">
                                        <label class="text-gray-900" for="borndate">Escribe tu fecha de nacimiento: </label>
                                        <input type="date" class="form-control" id="borndate"
                                                                            placeholder="Escribe tu numero de teléfono...">
                                    </div>
                                    <div class="form-group row">
                                        <div class="col-sm-6 mb-3 mb-sm-0">
                                            <label class="text-gray-900" for="password">Escribe tu contraseña:</label><input type="password" class="form-control form-control-user"
                                                                                      id="password" placeholder="Escribe tu contraseña...">
                                        </div>
                                        <div class="col-sm-6">
                                            <label class="text-gray-900" for="repeatPassword" style="color: white;">.</label><input type="password" class="form-control form-control-user"
                                                                                       id="repeatPassword" placeholder="Repite tu contraseña...">
                                        </div>
                                    </div>
                                    <a id="btnRegister" class="btn btn-primary btn-user btn-block" style="font-size: 18px;"> Registrarse </a>
                                    <hr>
                                </form>
                                <div class="text-center">
                                    <a href="login.html">Ya tienes cuenta? ¡Inicia sessión!</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bootstrap core JavaScript-->
        <script src="/shared/vendor/jquery/jquery.min.js"></script>
        <script src="/shared/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

        <!-- Core plugin JavaScript-->
        <script src="/shared/vendor/jquery-easing/jquery.easing.min.js"></script>

        <!-- Custom scripts for all pages-->
        <script src="/shared/js/sb-admin-2.min.js"></script>

        <script src="js/register.js"></script>

    </body>

</html>
